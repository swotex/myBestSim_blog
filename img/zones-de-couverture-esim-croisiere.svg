<g font-family="system-ui,'Instrument Sans',Arial,sans-serif" font-size="20" fill="#DDEAF1">
<text x="200" y="378" text-anchor="middle">WiFi du bord : oui</text>
<text x="600" y="378" text-anchor="middle">WiFi du bord : oui</text>
<text x="1000" y="378" text-anchor="middle">WiFi du bord : oui</text>
