<rect x="-6" y="-60" width="16" height="20" fill="#E8541E"/>
<rect x="-56" y="12" width="112" height="5" fill="#E8541E"/>
</g>
<use href="#ship" x="210" y="262"/>
<use href="#ship" x="610" y="262"/>
<use href="#ship" x="1010" y="262"/>
<g fill="none" stroke="#9FE0F5" stroke-width="4" stroke-linecap="round">
<path d="M130 160 A60 60 0 0 1 130 224" />
<path d="M150 140 A100 100 0 0 1 150 244" opacity=".7"/>
<path d="M510 160 A60 60 0 0 1 510 224" opacity=".45" stroke-dasharray="10 12"/>
</g>
<g font-family="system-ui,'Instrument Sans',Arial,sans-serif" font-size="22" font-weight="600">
<text x="200" y="340" text-anchor="middle" fill="#7EE2B8">eSIM : oui</text>
<text x="600" y="340" text-anchor="middle" fill="#FFC857">eSIM : variable</text>
<text x="1000" y="340" text-anchor="middle" fill="#FF9C85">eSIM classique : non</text>
