<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Trois positions d'un navire : à quai, près des côtes, en pleine mer, avec la disponibilité d'une eSIM classique et du WiFi du bord">
<rect width="1200" height="420" fill="#0B2239"/>
<rect y="250" width="1200" height="170" fill="#0E5A78"/>
<path d="M0 250 L0 190 Q60 160 110 196 L160 250 Z" fill="#06233A"/>
<rect x="64" y="110" width="7" height="82" fill="#CFE6F0"/>
<circle cx="67" cy="108" r="6" fill="#FF8A57"/>
<g stroke="#2A5470" stroke-width="2" stroke-dasharray="4 8"><path d="M400 40 V250"/><path d="M800 40 V250"/></g>
<g font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" font-size="20" fill="#9FE0F5" letter-spacing="2">
<text x="200" y="44" text-anchor="middle">À QUAI</text>
<text x="600" y="44" text-anchor="middle">PRÈS DES CÔTES</text>
<text x="1000" y="44" text-anchor="middle">PLEINE MER</text>
</g>
<g id="ship">
<path d="M-70 0 H70 L56 20 H-56 Z" fill="#F2F6F8"/>
